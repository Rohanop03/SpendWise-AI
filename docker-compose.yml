services:
  postgres:
    image: postgres:16-alpine
    container_name: spendwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendwise_dev}
      POSTGRES_USER: ${POSTGRES_USER:-spendwise_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendwise_local_secret}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-spendwise_app} -d ${POSTGRES_DB:-spendwise_dev}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendwise-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-spendwise_app}:${POSTGRES_PASSWORD:-spendwise_local_secret}@postgres:5432/${POSTGRES_DB:-spendwise_dev}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-spendwise_jwt_secret_must_be_32_characters_minimum}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
    ports:
      - '5000:5000'

  reminder-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendwise-reminder-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-spendwise_app}:${POSTGRES_PASSWORD:-spendwise_local_secret}@postgres:5432/${POSTGRES_DB:-spendwise_dev}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      REMINDER_BATCH_SIZE: ${REMINDER_BATCH_SIZE:-500}
    command: ['node', 'server/scripts/startReminderWorker.js']

volumes:
  pgdata:
    driver: local
