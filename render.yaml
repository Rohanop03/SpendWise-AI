services:
  # SpendWise Backend API
  - type: web
    name: spendwise-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server/src/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: spendwise-web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

  # SpendWise React Frontend
  - type: web
    name: spendwise-web
    runtime: static
    plan: starter
    buildCommand: npm run build --workspace client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: spendwise-api
          property: url

databases:
  # Managed PostgreSQL Instance
  - name: spendwise-db
    databaseName: spendwise_prod
    user: spendwise_admin
    plan: starter
    postgresMajorVersion: 16
